<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Premier League — Comparaison d’équipes</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== LAYOUT GLOBAL ===== */
    .compare-layout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)); /* 50% / 50% */
      gap: 40px;
      max-width: 1800px;
      margin: 150px auto;
      padding: 0 40px;
      align-items: stretch; /* même hauteur pour les 2 colonnes */
    }
  
    /* ===== CARTES GAUCHE & DROITE (même base visuelle) ===== */
    .compare-card,
    .compare-video {
      background: var(--card);
      border-radius: var(--radius);
      outline: 1px solid #d971ff;
      box-shadow:
        0 0 10px #d971ff,
        0 0 18px rgba(217,113,255,.6),
        0 0 30px rgba(217,113,255,.4);
      min-height: 650px;           /* même hauteur de base */
    }
  
    /* La carte de gauche a du padding interne, la vidéo NON */
    .compare-card {
      padding: 32px 32px 34px;
      display: flex;
      flex-direction: column;
    }
  
    /* ===== CONTENU CARTE COMPARAISON (GAUCHE) ===== */
    .compare-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
      text-align: center;
    }
  
    .compare-text {
      max-width: 620px;
    }
  
    .compare-text h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
  
    .compare-text p {
      opacity: .9;
      font-size: 14px;
      line-height: 1.5;
    }
  
    .compare-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: center;
    }
  
    .compare-controls > div {
      min-width: 200px;
      text-align: left;
    }
  
    .compare-controls label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      opacity: .75;
      display: block;
      margin-bottom: 4px;
    }
  
    .compare-select {
      appearance: none;
      background: #32083a;
      color: #fff;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.15);
      padding: 8px 18px;
      font-weight: 700;
      font-size: 14px;
      outline: none;
      width: 100%;
      transition: all .25s ease;
      cursor: pointer;
    }
  
    .compare-select:hover {
      background: #fff;
      color: #32083a;
      border-color: #32083a;
    }
  
    .compare-select:focus-visible {
      background: #fff;
      color: #32083a;
      border-color: #d971ff;
      box-shadow: 0 0 0 3px rgba(217,113,255,.35);
    }
  
    #comparisonChart {
      width: 100%;
      height: 460px;
      margin-top: 16px;
    }
  
    .compare-warning {
      font-size: 13px;
      margin-top: 6px;
      color: #ffd3e0;
      text-align: center;
      display: none;
    }
  
    /* ===== VIDEO (DROITE) ===== */
    .compare-video {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;           /* 🔥 important : pas de padding interne */
      overflow: hidden;     /* évite que la vidéo dépasse avec object-fit */
    }
  
    .compare-video video {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: calc(var(--radius) - 8px);
      object-fit: cover;    /* la vidéo remplit tout le carré */
    }
  
    /* ===== RESPONSIVE ===== */
    @media (max-width: 1000px) {
      .compare-layout {
        grid-template-columns: 1fr;
        margin: 120px auto 110px;
        padding: 0 16px;
      }
  
      .compare-card,
      .compare-video {
        min-height: 420px;
      }
  
      #comparisonChart {
        height: 340px;
      }
    }
  </style>
  
</head>

<body>
  <!-- HEADER -->
  <header class="pl-header">
    <div class="pl-wrap">
      <img class="pl-logo"
           src="https://upload.wikimedia.org/wikipedia/en/f/f2/Premier_League_Logo.svg"

      <nav class="pl-nav">
        <a href="index.html" class="nav-link">Accueil</a>

        <a href="equipes.html" class="nav-link">Équipes</a>
        <a href="comparaison.html" class="nav-link">Comparaison</a>
        <a href="probabilites.html" class="nav-link">Chances de gagner</a>
      </nav>
    </div>
  </header>

  <!-- LAYOUT 2 COLONNES -->
  <main class="compare-layout">

    <!-- COLONNE GAUCHE : CARTE COMPARAISON -->
    <section class="compare-card">
      <div class="compare-header">
        <div class="compare-text">
          <h1>Comparer deux équipes</h1>
          <p>
            Choisis deux clubs de Premier League pour visualiser l’évolution de leurs 
            <strong>statistiques par saison</strong>.   
          </p>
        </div>

        <div class="compare-controls">
          <div>
            <label for="teamA">ÉQUIPE A</label>
            <select id="teamA" class="compare-select"></select>
          </div>
          <div>
            <label for="teamB">ÉQUIPE B</label>
            <select id="teamB" class="compare-select"></select>
          </div>
          <div>
            <label for="metric">MÉTRIQUE</label>
            <select id="metric" class="compare-select">
              <option value="goals">Buts</option>
              <option value="wins">Victoires</option>
              <option value="total_pass">Passes</option>
              <option value="clean_sheet">Clean Sheets</option>
              <option value="total_scoring_att">Tirs</option>
              <option value="ontarget_scoring_att">Tirs cadrés</option>
              <option value="total_tackle">Tacles</option>
            </select>
          </div>
        </div>
      </div>

      <div id="comparisonChart" aria-label="Graphique comparant l’évolution des stats par saison"></div>
      <div id="same-team-warning" class="compare-warning">
        ⚠ Tu as sélectionné deux fois la même équipe : la comparaison est moins parlante.
      </div>
    </section>

    <!-- COLONNE DROITE : VIDEO -->
    <aside class="compare-video">
      <!-- Mets ton fichier vidéo à la racine du projet avec ce nom -->
      <video src="plvideo.mp4" autoplay muted loop></video>
    </aside>

  </main>
